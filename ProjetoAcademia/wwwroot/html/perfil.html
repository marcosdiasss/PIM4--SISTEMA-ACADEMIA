<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil do aluno - Prime Fitness Club</title>
    <link rel="icon" href="../img/relatorio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body data-page="perfil">

    <div class="app">
        <main class="main">

            <header class="cabecalho-pagina">
                <h1 class="titulo">Perfil do aluno</h1>
                <div class="hero-acoes">
                    <button type="button" class="btn btn-destaque" id="btnEditar">Editar dados</button>
                    <button type="button" class="btn btn-perigo" id="btn-cancelar-matricula" hidden>Cancelar matrícula</button>
                </div>
            </header>

            <p id="mensagem-perfil" class="mensagem" role="status" aria-live="polite"></p>

            <section class="cartao perfil-cabecalho">
                <div class="foto-area">
                    <div class="foto-perfil">
                        <img id="iconePadrao" src="../img/perfil.svg" alt="" />
                        <img id="fotoAluno" src="" alt="Foto do aluno" />
                    </div>
                    <div class="foto-acoes">
                        <button type="button" class="btn-excluir-foto" data-action="remover-foto" hidden>Excluir foto</button>
                        <label for="inputFoto" class="btn-foto">Adicionar foto</label>
                        <input type="file" id="inputFoto" accept="image/*" />
                    </div>
                </div>

                <div class="dados-lista">
                    <div class="info-item">
                        <span class="info-titulo">Nome</span>
                        <span class="info-valor" id="perfilNome">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-titulo">Data de nascimento</span>
                        <span class="info-valor" id="perfilData">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-titulo">Telefone</span>
                        <span class="info-valor" id="perfilTelefone">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-titulo">CPF</span>
                        <span class="info-valor" id="perfilCpf">-</span>
                    </div>
                </div>
            </section>

            <section class="cartao">
                <h2 class="titulo">Matrícula</h2>
                <div class="dados-lista">
                    <div class="info-item">
                        <span class="info-titulo">Plano</span>
                        <span class="info-valor" id="perfilPlano">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-titulo">Forma de pagamento</span>
                        <span class="info-valor" id="perfilPagamento">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-titulo">Início</span>
                        <span class="info-valor" id="perfilInicio">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-titulo">Término</span>
                        <span class="info-valor" id="perfilTermino">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-titulo">Situação</span>
                        <span class="info-valor" id="perfilSituacao">-</span>
                    </div>
                </div>
            </section>

            <div class="acoes-form">
                <button type="button" class="btn btn-claro" data-href="lista.html">Voltar</button>
            </div>

        </main>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="../js/layout.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="../js/script.js?v3"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
