<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Código de segurança - Prime Fitness Club</title>
    <link rel="icon" href="../img/relatorio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body data-page="codigo-seguranca">

    <div class="app">
        <main class="main">

            <header class="cabecalho-pagina">
                <h1 class="titulo">Código de segurança</h1>
            </header>

            <form class="cartao formulario" novalidate>
                <section class="secao-form">
                    <h2>Alterar código</h2>
                    <p class="nota">Este código é usado pelos administradores para recuperar a senha. Só o master pode alterá-lo.</p>
                    <div class="grade-form">
                        <div class="campo">
                            <label for="codigo-atual-master">Código atual</label>
                            <input type="password" id="codigo-atual-master" autocomplete="off" />
                        </div>
                        <div class="campo">
                            <label for="novo-codigo-master">Novo código</label>
                            <input type="password" id="novo-codigo-master" autocomplete="new-password" />
                        </div>
                        <div class="campo">
                            <label for="confirmar-codigo-master">Confirmar novo código</label>
                            <input type="password" id="confirmar-codigo-master" autocomplete="new-password" />
                        </div>
                    </div>
                    <ul class="requisitos">
                    <li>Mínimo de 8 caracteres</li>
                    <li>Mínimo de 2 números</li>
                    <li>Mínimo de 1 caractere especial</li>
                    <li>Mínimo de 1 letra maiúscula e 1 minúscula</li>
                </ul>
                </section>

                <p id="mensagem-codigo" class="mensagem" role="status" aria-live="polite"></p>

                <div class="acoes-form">
                    <button type="button" class="btn btn-claro" data-href="master.html">Cancelar</button>
                    <button type="button" class="btn btn-destaque" id="btn-salvar-codigo">Salvar código</button>
                </div>
            </form>
        </main>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="../js/layout.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="../js/script.js?v3"></script>
    <script src="../js/codigo.js"></script>

</body>
</html>
