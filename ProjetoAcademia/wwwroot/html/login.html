<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - Prime Fitness Club</title>
    <link rel="icon" href="../img/relatorio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body data-page="login">

    <div class="entrada">

        <section class="entrada-painel">
            <div class="marca">
                <span class="marca-nome">PRIME</span>
                <span class="marca-sub">FITNESS CLUB</span>
            </div>

            <div>
                <h1 class="entrada-titulo">Seu treino começa aqui</h1>
                <p class="entrada-texto">Gerencie alunos, matrículas e relatórios da academia em um só lugar.</p>
            </div>

            <ul class="valores-entrada">
                <li><i class="bi bi-lightning-charge-fill" aria-hidden="true"></i>Força e saúde</li>
                <li><i class="bi bi-bullseye" aria-hidden="true"></i>Foco e disciplina</li>
                <li><i class="bi bi-graph-up-arrow" aria-hidden="true"></i>Evolução constante</li>
            </ul>
        </section>

        <section class="entrada-form-area">
            <form class="cartao entrada-cartao" id="form-login" novalidate>
                <h2 class="titulo">Acesso ao sistema</h2>

                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <div class="campo-icone">
                        <i class="bi bi-person-circle" aria-hidden="true"></i>
                        <input type="text" id="usuario" placeholder="Digite seu usuário" autocomplete="username" />
                    </div>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-icone">
                        <i class="bi bi-lock-fill" aria-hidden="true"></i>
                        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" />
                        <button type="button" class="olho bi bi-eye-slash" data-action="toggle-senha" data-target="senha" aria-label="Mostrar ou ocultar a senha"></button>
                    </div>
                </div>

                <button type="button" class="link-esqueci" data-action="esqueci-senha">Esqueci minha senha</button>

                <p id="erro-login" class="mensagem" role="alert"></p>

                <button type="submit" class="btn btn-destaque btn-bloco">Entrar</button>

                <p class="entrada-rodape">PRIME FITNESS CLUB</p>
            </form>
        </section>

    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="../js/script.js?v3"></script>

</body>
</html>
