<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar aluno - Prime Fitness Club</title>
    <link rel="icon" href="../img/relatorio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body data-page="editar">

    <div class="app">
        <main class="main">

            <header class="cabecalho-pagina">
                <h1 class="titulo">Editar aluno</h1>
            </header>

            <form class="cartao formulario" novalidate>
                <section class="secao-form">
                    <h2>Dados do aluno</h2>
                    <div class="grade-form">
                        <div class="campo">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="Digite o nome do aluno" autocomplete="off" />
                        </div>
                        <div class="campo">
                            <label for="dataNascimento">Data de nascimento</label>
                            <input type="date" id="dataNascimento" />
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" maxlength="15" inputmode="tel" placeholder="(XX) XXXXX-XXXX" />
                        </div>
                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" maxlength="14" inputmode="numeric" placeholder="000.000.000-00" />
                        </div>
                    </div>
                    <p class="nota">O plano e a forma de pagamento são definidos na matrícula e não mudam por aqui.</p>
                </section>

                <p id="mensagem-edicao" class="mensagem" role="status" aria-live="polite"></p>

                <div class="acoes-form">
                    <button type="button" class="btn btn-claro" data-href="perfil.html">Cancelar</button>
                    <button type="button" class="btn btn-destaque" data-action="salvar-edicao">Salvar</button>
                </div>
            </form>

        </main>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="../js/layout.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="../js/script.js?v3"></script>
</body>
</html>
