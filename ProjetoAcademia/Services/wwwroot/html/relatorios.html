<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios - Prime Fitness Club</title>
    <link rel="icon" href="../img/relatorio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body data-page="relatorios">

    <div class="app">
        <main class="main">

            <header class="cabecalho-pagina">
                <h1 class="titulo">Relatórios</h1>
                <button type="button" class="btn btn-destaque" data-action="gerar-documento-relatorio">Gerar documento</button>
            </header>

            <p class="aviso" id="aviso-relatorios" hidden></p>

            <section class="cartao filtros" aria-label="Filtros">
                <div class="campo">
                    <label for="filtro-inicio">Início a partir de</label>
                    <input type="date" id="filtro-inicio" />
                </div>
                <div class="campo">
                    <label for="filtro-fim">Início até</label>
                    <input type="date" id="filtro-fim" />
                </div>
                <div class="campo">
                    <label for="filtro-ano">Ano do gráfico mensal</label>
                    <input type="number" id="filtro-ano" min="2000" max="2100" />
                </div>
                <div class="filtros-acoes">
                    <button type="button" class="btn btn-destaque" id="btn-aplicar">Aplicar</button>
                    <button type="button" class="btn btn-claro" id="btn-limpar">Limpar</button>
                </div>
            </section>

            <section class="kpis" aria-label="Resumo">
                <div class="cartao kpi">
                    <span class="kpi-rotulo">Matrículas ativas no período</span>
                    <span class="kpi-numero" id="kpi-total">0</span>
                    <span class="kpi-nota">Pela data de início</span>
                </div>
                <div class="cartao kpi">
                    <span class="kpi-rotulo">Plano mais escolhido</span>
                    <span class="kpi-numero" id="kpi-plano">—</span>
                    <span class="kpi-nota">Entre as matrículas ativas</span>
                </div>
                <div class="cartao kpi">
                    <span class="kpi-rotulo">Pagamento mais usado</span>
                    <span class="kpi-numero" id="kpi-pagamento">—</span>
                    <span class="kpi-nota">Todas as matrículas</span>
                </div>
            </section>

            <section class="cartao">
                <h2 class="titulo">Novas matrículas por mês</h2>
                <div class="colunas" id="grafico-meses"></div>
            </section>

            <div class="tres-colunas">
                <section class="cartao">
                    <h2 class="titulo">Matrículas ativas por plano</h2>
                    <div class="barras" id="grafico-planos"></div>
                </section>

                <section class="cartao">
                    <h2 class="titulo">Formas de pagamento</h2>
                    <div class="barras" id="grafico-pagamentos"></div>
                </section>
            </div>

        </main>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="../js/layout.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="../js/script.js?v3"></script>
    <script src="../js/relatorios.js"></script>

</body>
</html>
