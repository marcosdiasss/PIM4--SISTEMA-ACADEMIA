<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova matrícula - Prime Fitness Club</title>
    <link rel="icon" href="../img/relatorio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body data-page="cadastro">

    <div class="app">
        <main class="main">

            <header class="cabecalho-pagina">
                <h1 class="titulo">Nova matrícula</h1>
            </header>

            <form class="cartao formulario" novalidate>

                <section class="secao-form">
                    <h2>Dados do aluno</h2>
                    <div class="grade-form">
                        <div class="campo">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="Digite o nome do aluno" autocomplete="off" />
                        </div>
                        <div class="campo">
                            <label for="dataNascimento">Data de nascimento</label>
                            <input type="date" id="dataNascimento" />
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" maxlength="15" inputmode="tel" placeholder="(XX) XXXXX-XXXX" />
                        </div>
                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" maxlength="14" inputmode="numeric" placeholder="000.000.000-00" />
                        </div>
                    </div>
                </section>

                <section class="secao-form">
                    <h2>Matrícula</h2>
                    <div class="grade-form">
                        <div class="campo">
                            <label for="plano">Plano</label>
                            <select id="plano">
                                <option value="">Selecione o plano</option>
                                <option value="1">Mensal (1 mês)</option>
                                <option value="2">Trimestral (3 meses)</option>
                                <option value="3">Semestral (6 meses)</option>
                                <option value="4">Anual (12 meses)</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="pagamento">Forma de pagamento</label>
                            <select id="pagamento">
                                <option value="">Selecione a forma de pagamento</option>
                                <option value="Crédito">Crédito</option>
                                <option value="Débito">Débito</option>
                                <option value="PIX">PIX</option>
                                <option value="Dinheiro">Dinheiro</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="dataInicio">Data de início da matrícula</label>
                            <input type="date" id="dataInicio" />
                        </div>
                    </div>
                </section>

                <p id="mensagem-cadastro" class="mensagem" role="status" aria-live="polite"></p>

                <div class="acoes-form">
                    <button type="button" class="btn btn-claro" data-href="lista.html">Cancelar</button>
                    <button type="button" class="btn btn-destaque" data-action="cadastrar">Cadastrar</button>
                </div>

            </form>

        </main>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="../js/layout.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="../js/script.js?v3"></script>

</body>
</html>
