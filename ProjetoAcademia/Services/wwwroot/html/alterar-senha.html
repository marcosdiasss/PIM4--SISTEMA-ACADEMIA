<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alterar senha - Prime Fitness Club</title>
    <link rel="icon" href="../img/relatorio.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/app.css" />
</head>

<body class="pagina-publica" data-page="alterar-senha">

    <a class="marca" href="login.html" aria-label="Prime Fitness Club, voltar ao login">
        <span class="marca-nome">PRIME</span>
        <span class="marca-sub">FITNESS CLUB</span>
    </a>

    <form class="cartao cartao-publico" novalidate>
        <h1 class="titulo">Alterar senha</h1>

        <div class="campo">
            <label for="usuario-recuperacao">Usuário</label>
            <input type="text" id="usuario-recuperacao" placeholder="Digite seu usuário" autocomplete="username" />
        </div>
        <div class="campo">
            <label for="codigo-seguranca">Código de segurança</label>
            <input type="password" id="codigo-seguranca" placeholder="Informado pelo administrador master" autocomplete="off" />
        </div>
        <div class="campo">
            <label for="nova-senha">Nova senha</label>
            <input type="password" id="nova-senha" autocomplete="new-password" />
        </div>
        <div class="campo">
            <label for="confirmar-senha">Confirmar nova senha</label>
            <input type="password" id="confirmar-senha" autocomplete="new-password" />
        </div>

        <ul class="requisitos">
            <li>Mínimo de 8 caracteres</li>
            <li>Mínimo de 2 números</li>
            <li>Mínimo de 1 caractere especial</li>
            <li>Mínimo de 1 letra maiúscula e 1 minúscula</li>
        </ul>

        <p id="mensagem-recuperacao" class="mensagem" role="status" aria-live="polite"></p>

        <div class="acoes-form">
            <a class="btn btn-claro" href="login.html">Voltar ao login</a>
            <button type="button" class="btn btn-destaque" id="btn-alterar-senha">Alterar senha</button>
        </div>
    </form>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="../js/recuperar.js"></script>

</body>
</html>
